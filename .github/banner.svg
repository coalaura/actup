<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title description">
  <title id="title">actup</title>
  <desc id="description">GitHub Actions version updates. A release tag travels from v4 to v5 along a rising workflow line beneath a custom actup wordmark. The raised u ends in an upward arrow.</desc>

  <defs>
    <!-- Hand-drawn letter outlines keep the wordmark independent of fonts. -->
    <g id="act" fill-rule="evenodd">
      <path d="M344 111C309 111 286 136 286 171C286 207 309 231 343 231C360 231 373 224 382 213V228H408V114H382V129C373 117 360 111 344 111ZM348 135C369 135 383 150 383 171C383 193 369 207 348 207C326 207 312 192 312 171C312 151 326 135 348 135Z"/>
      <path d="M488 111C450 111 425 136 425 171C425 207 450 231 488 231C510 231 525 222 536 209L518 193C510 202 501 207 489 207C467 207 451 192 451 171C451 150 467 135 489 135C501 135 510 140 518 149L536 132C524 118 509 111 488 111Z"/>
      <path d="M564 82H590V114H628V137H590V191C590 202 596 208 608 208C615 208 621 206 628 203V226C619 230 610 232 601 232C577 232 564 219 564 194V137H544V114H564Z"/>
    </g>
    <g id="up" fill-rule="evenodd">
      <path d="M652 70H678V140C678 156 686 165 702 165C718 165 728 154 728 138V74H714L741 39L769 74H754V187H729V172C721 183 709 190 694 190C668 190 652 174 652 145Z"/>
      <path d="M784 70H810V85C820 73 833 67 850 67C884 67 908 92 908 128C908 164 884 189 850 189C833 189 820 182 810 170V235H784ZM845 91C824 91 809 106 809 128C809 150 824 165 845 165C867 165 882 150 882 128C882 106 867 91 845 91Z"/>
    </g>

    <!-- A punched release tag; mirroring the body reverses its direction. -->
    <path id="release-tag" fill-rule="evenodd" d="M2 0H110L148 38L110 76H2Q0 76 0 74V2Q0 0 2 0ZM134 38A6 6 0 1 0 122 38A6 6 0 1 0 134 38Z"/>
    <path id="version-prefix" d="M0 0L10 28L20 0"/>
    <path id="version-four" d="M20 29V0L0 20H27"/>
    <path id="version-five" d="M24 0H3L1 13H14C30 13 29 29 14 29H0"/>

    <!-- The workflow passes behind the letters, with a transparent clearance. -->
    <mask id="workflow-clearance" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="360">
      <path fill="#fff" d="M0 0H1200V360H0Z"/>
      <g fill="#000" stroke="#000" stroke-width="16" stroke-linejoin="round">
        <use href="#act"/>
        <use href="#up"/>
      </g>
    </mask>
  </defs>

  <!-- One continuous route lifts the version reference through the wordmark. -->
  <path d="M204 215V248C204 263 216 275 232 275H548C574 275 588 269 607 250L627 230C647 210 665 207 687 207H972C992 207 1002 191 1002 171V115"
        stroke="#82758f" stroke-width="5" mask="url(#workflow-clearance)"/>

  <g aria-hidden="true">
    <use href="#act" fill="#eeedf4"/>
    <use href="#up" fill="#b5ef7b"/>
  </g>

  <!-- The old reference hangs back; the updated one is lifted and level. -->
  <g transform="translate(76 177) rotate(10 128 38)">
    <use href="#release-tag" fill="#2d2633" stroke="#b49bae" stroke-width="2"/>
    <g stroke="#d0b9ca" stroke-width="5" stroke-linecap="square" stroke-linejoin="round">
      <use href="#version-prefix" transform="translate(20 23)"/>
      <use href="#version-four" transform="translate(54 23)"/>
    </g>
  </g>
  <g transform="translate(982 77)">
    <use href="#release-tag" transform="translate(148 0) scale(-1 1)" fill="#b5ef7b"/>
    <g stroke="#23331c" stroke-width="5" stroke-linecap="square" stroke-linejoin="round">
      <use href="#version-prefix" transform="translate(51 23)"/>
      <use href="#version-five" transform="translate(85 23)"/>
    </g>
  </g>

  <text x="600" y="330" fill="#b9b3c5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="25" text-anchor="middle">GitHub Actions version updates</text>
</svg>
